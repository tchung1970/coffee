<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="twitter:description" content="8개의 짧은 질문으로 당신의 MBTI에 어울리는 커피 메뉴와 한국 브랜드를 찾아보세요.">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream: #f5ebdd;
      --cream-dark: #e8d9c2;
      --espresso: #2a1810;
      --crema: #c8956d;
      --milk: #fbf6ee;
      --accent: #8b4513;
      --text: #3d2817;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at top, #f5ebdd 0%, #e8d4b8 70%, #d4b896 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
      word-break: keep-all;
    }

    .beans-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bean {
      position: absolute;
      font-size: 1.4rem;
      opacity: 0.12;
      animation: drift linear infinite;
    }

    @keyframes drift {
      0%   { transform: translateY(110vh) rotate(0deg); }
      100% { transform: translateY(-15vh) rotate(360deg); }
    }

    .stage {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
    }

    .card {
      background: var(--milk);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow:
        0 30px 60px -20px rgba(60, 30, 10, 0.25),
        0 12px 24px -8px rgba(60, 30, 10, 0.15);
      animation: fadeIn 0.45s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .screen { display: none; }
    .screen.active { display: block; }

    /* ---------- Intro ---------- */
    .intro { text-align: center; }
    .intro .cup {
      font-size: 4.5rem;
      line-height: 1;
      margin-bottom: 0.5rem;
      animation: steam 3s ease-in-out infinite;
    }

    @keyframes steam {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    .intro h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--espresso);
      margin-bottom: 0.6rem;
      letter-spacing: -0.01em;
    }

    .intro p {
      color: #6b4f3a;
      margin-bottom: 0.6rem;
      line-height: 1.6;
      font-size: 1.02rem;
    }

    .intro .no-sbux {
      display: inline-block;
      margin: 0.4rem 0 1.6rem;
      padding: 0.45rem 0.95rem;
      background: var(--cream);
      border: 1px dashed var(--crema);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.92rem;
      font-style: italic;
    }

    .btn {
      display: inline-block;
      background: var(--espresso);
      color: var(--milk);
      border: none;
      padding: 0.95rem 2.2rem;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 18px -6px rgba(42, 24, 16, 0.45);
      font-family: inherit;
    }

    .btn:hover { background: #3d2417; transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }

    .btn.secondary {
      background: transparent;
      color: var(--espresso);
      border: 1.5px solid var(--espresso);
      box-shadow: none;
    }
    .btn.secondary:hover { background: var(--espresso); color: var(--milk); }

    /* ---------- Question ---------- */
    .progress {
      height: 6px;
      background: var(--cream-dark);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1.6rem;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--crema), var(--accent));
      width: 0%;
      transition: width 0.35s ease;
      border-radius: 999px;
    }

    .q-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      margin-bottom: 0.6rem;
    }

    .q-number {
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      color: var(--accent);
      font-weight: 600;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      color: rgba(61, 40, 23, 0.6);
      padding: 0.3rem 0.55rem;
      border-radius: 999px;
      transition: color 0.15s ease, background 0.15s ease;
    }
    .back-btn:hover { color: var(--espresso); background: var(--cream); }
    .back-btn[hidden] { display: none; }

    .q-text {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--espresso);
      line-height: 1.45;
      margin-bottom: 1.6rem;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .option {
      background: var(--cream);
      border: 2px solid transparent;
      padding: 1.05rem 1.2rem;
      border-radius: 14px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      color: var(--text);
      font-family: inherit;
      transition: all 0.18s ease;
      line-height: 1.5;
    }

    .option:hover {
      border-color: var(--crema);
      background: #faf0e0;
      transform: translateX(3px);
    }

    .option:active { transform: translateX(0); }

    /* ---------- Result ---------- */
    .result { text-align: center; }
    .result .badge {
      display: inline-block;
      background: var(--espresso);
      color: var(--crema);
      padding: 0.35rem 1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      font-weight: 700;
      margin-bottom: 1.1rem;
    }
    .result .coffee-icon {
      font-size: 4.5rem;
      margin-bottom: 0.4rem;
    }
    .result h2 {
      font-size: 1.9rem;
      color: var(--espresso);
      margin-bottom: 0.4rem;
      letter-spacing: -0.01em;
    }
    .result .brand-chip {
      display: inline-block;
      margin: 0.2rem 0 0.9rem;
      padding: 0.4rem 1rem;
      background: var(--espresso);
      color: var(--cream);
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .result .brand-chip .at { opacity: 0.6; margin-right: 0.35rem; }
    .result .tagline {
      color: var(--accent);
      font-style: italic;
      margin-bottom: 1.3rem;
      font-size: 1.02rem;
    }
    .result .description {
      color: #5a4030;
      line-height: 1.75;
      text-align: left;
      background: var(--cream);
      padding: 1.2rem 1.3rem;
      border-radius: 14px;
      margin-bottom: 1.3rem;
      font-size: 0.98rem;
    }
    .result .description strong {
      color: var(--espresso);
    }
    .result .actions {
      display: flex;
      gap: 0.7rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.4rem; border-radius: 20px; }
      .intro h1 { font-size: 1.7rem; }
      .q-text { font-size: 1.18rem; }
      .result h2 { font-size: 1.6rem; }
    }

    /* ---------- Share menu ---------- */
    .share-menu {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .share-menu[hidden] { display: none; }
    .share-menu-backdrop {
      position: absolute; inset: 0;
      background: rgba(42, 24, 16, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      animation: fadeIn 0.2s ease;
    }
    .share-menu-card {
      position: relative; z-index: 1;
      background: var(--milk);
      border-radius: 20px;
      padding: 1.3rem 1.4rem 1.4rem;
      width: 100%; max-width: 360px;
      box-shadow: 0 30px 60px -20px rgba(60, 30, 10, 0.4);
      animation: popIn 0.22s ease;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(8px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .share-menu-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem;
      font-weight: 700; color: var(--espresso); font-size: 1rem;
    }
    .share-menu-close {
      background: none; border: none; cursor: pointer;
      font-size: 1.05rem; color: rgba(61, 40, 23, 0.55);
      padding: 0.2rem 0.4rem; line-height: 1;
    }
    .share-menu-close:hover { color: var(--espresso); }
    .share-menu-items {
      display: flex; flex-direction: column; gap: 0.45rem;
    }
    .share-item {
      background: var(--cream);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      display: flex; align-items: center; gap: 0.85rem;
      cursor: pointer; font-family: inherit;
      color: var(--text); font-size: 0.97rem; font-weight: 600;
      transition: all 0.15s ease;
      width: 100%; text-align: left;
    }
    .share-item:hover {
      border-color: var(--crema); background: #faf0e0;
    }
    .share-item-icon {
      font-size: 1.3rem; width: 28px; text-align: center; line-height: 1;
    }
    .share-item.copied { background: #e8f5e9; border-color: #81c784; color: #2e7d32; }

    .footer {
      margin-top: 1.2rem;
      text-align: center;
      color: rgba(61, 40, 23, 0.6);
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }
    .footer a {
      color: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      border-bottom: 1px dotted currentColor;
      padding-bottom: 1px;
      transition: color 0.15s ease;
    }
    .footer a:hover { color: var(--espresso); }
    .footer .sep { opacity: 0.5; }
    .footer svg { display: block; }
  </style>
</head>
<body>
  <div class="beans-bg" id="beansBg"></div>

  <div class="stage">
    <div class="card">
      <!-- Intro -->
      <section class="screen intro active" id="screenIntro">
        <div class="cup">☕</div>
        <h1>당신은 어떤 커피인가요?</h1>
        <p>8개의 짧은 질문으로 당신의 MBTI에 어울리는 커피를 찾아보세요.</p>
        <div class="no-sbux">걱정 마세요, 스타벅스는 추천하지 않을게요 😉</div>
        <button class="btn" id="startBtn">테스트 시작하기</button>
      </section>

      <!-- Question -->
      <section class="screen" id="screenQuestion">
        <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
        <div class="q-header">
          <div class="q-number" id="qNumber">8문항 중 1번</div>
          <button class="back-btn" id="backBtn" type="button" hidden>← 이전</button>
        </div>
        <div class="q-text" id="qText"></div>
        <div class="options" id="qOptions"></div>
      </section>

      <!-- Result -->
      <section class="screen result" id="screenResult">
        <div class="badge" id="rBadge">INTJ</div>
        <div class="coffee-icon" id="rIcon">☕</div>
        <h2 id="rName"></h2>
        <div class="brand-chip" id="rBrand"></div>
        <div class="tagline" id="rTagline"></div>
        <div class="description" id="rDescription"></div>
        <div class="actions">
          <button class="btn" id="retryBtn">다시 하기</button>
          <button class="btn secondary" id="shareBtn">공유하기</button>
        </div>
      </section>
    </div>

    <!-- Share menu (hidden until triggered) -->
    <div class="share-menu" id="shareMenu" hidden>
      <div class="share-menu-backdrop" data-close></div>
      <div class="share-menu-card" role="dialog" aria-labelledby="shareTitle">
        <div class="share-menu-header">
          <span id="shareTitle">이 결과 공유하기</span>
          <button class="share-menu-close" data-close aria-label="닫기">✕</button>
        </div>
        <div class="share-menu-items">
          <button class="share-item" data-action="copy">
            <span class="share-item-icon">📋</span>
            <span class="share-item-label">링크 복사</span>
          </button>
          <button class="share-item" data-action="imessage" data-mac-only>
            <span class="share-item-icon">💬</span>
            <span class="share-item-label">메시지로 보내기</span>
          </button>
          <button class="share-item" data-action="twitter">
            <span class="share-item-icon">𝕏</span>
            <span class="share-item-label">X에 공유</span>
          </button>
          <button class="share-item" data-action="threads">
            <span class="share-item-icon">🧵</span>
            <span class="share-item-label">Threads에 공유</span>
          </button>
          <button class="share-item" data-action="email">
            <span class="share-item-icon">📧</span>
            <span class="share-item-label">이메일로 보내기</span>
          </button>
        </div>
      </div>
    </div>

    <footer class="footer">
      <a href="https://www.anthropic.com/news/claude-opus-4-7" target="_blank" rel="noopener" aria-label="Claude Opus 4.7 발표 페이지">
        <svg width="14" height="14" viewBox="0 0 100 100" fill="#cc785c" aria-hidden="true">
          <g>
            <rect x="48" y="6" width="4" height="24" rx="2"/>

            <rect x="48" y="10" width="4" height="22" rx="2" transform="rotate(95 50 50)"/>
            <rect x="48" y="22" width="4" height="14" rx="2" transform="rotate(125 50 50)"/>

            <rect x="48" y="10" width="4" height="22" rx="2" transform="rotate(218 50 50)"/>
            <rect x="48" y="14" width="4" height="18" rx="2" transform="rotate(248 50 50)"/>

        GitHub

  </div>

  <script>
    // 각 질문은 MBTI 한 축에 매핑됩니다. 축당 2문항 = 총 8문항.
    // letters[0] = 첫 번째 옵션 선택 시 가산, letters[1] = 두 번째 옵션 선택 시 가산.
    const QUESTIONS = [
      { axis: 'EI', letters: ['E', 'I'],
        q: "토요일 아침, 어디로 향하나요?",
        opts: [
          "사람들로 북적이는 활기찬 카페",
          "책 한 권과 함께 조용한 구석 자리"
        ]},
      { axis: 'EI', letters: ['E', 'I'],
        q: "긴 하루 끝에 에너지를 어떻게 충전하나요?",
        opts: [
          "친구들과 어울리며 — 사람에게서 힘을 얻는다",
          "혼자만의 시간으로 — 고요함 속에서 회복한다"
        ]},
      { axis: 'SN', letters: ['S', 'N'],
        q: "카페에서 커피를 주문할 때, 당신은…",
        opts: [
          "늘 마시던 검증된 메뉴를 고른다",
          "흥미로워 보이는 새로운 메뉴를 시도한다"
        ]},
      { axis: 'SN', letters: ['S', 'N'],
        q: "당신은 어느 쪽에 더 끌리나요?",
        opts: [
          "구체적인 사실과 실용적인 디테일",
          "큰 그림과 무한한 가능성"
        ]},
      { axis: 'TF', letters: ['T', 'F'],
        q: "어려운 결정을 내릴 때, 무엇에 더 의지하나요?",
        opts: [
          "논리와 객관적인 분석",
          "가치관과 사람들의 감정"
        ]},
      { axis: 'TF', letters: ['T', 'F'],
        q: "친구가 힘든 하루를 털어놓을 때, 당신은…",
        opts: [
          "함께 해결책을 고민해본다",
          "먼저 들어주고 마음에 공감한다"
        ]},
      { axis: 'JP', letters: ['J', 'P'],
        q: "당신의 이상적인 주말은?",
        opts: [
          "꼼꼼히 짜둔 일정 — 계획표가 있어야 안심된다",
          "텅 빈 일정 — 흘러가는 대로 보내고 싶다"
        ]},
      { axis: 'JP', letters: ['J', 'P'],
        q: "당신의 책상(혹은 노트북 화면)은 보통…",
        opts: [
          "깔끔하게 정돈되어 있다",
          "창의적인 혼돈 그 자체다"
        ]},
    ];

    // 한국에서 만날 수 있는 비(非)스타벅스 브랜드 + 어울리는 메뉴 조합.
    const COFFEES = {
      INTJ: { icon: '☕', name: '에스프레소', brand: 'Blue Bottle (블루보틀)',
        tagline: '단 한 샷에 담긴 절제된 정밀함.',
        desc: '<strong>블루보틀</strong>의 미니멀한 카운터에서 마시는 진한 <strong>에스프레소</strong> 한 잔 — 군더더기를 걷어내고 본질만 남깁니다. 당신처럼 시끄러운 마케팅 없이 품질로 말하는 한 잔이에요.' },

      ISFJ: { icon: '🥖', name: '바닐라 라떼', brand: 'Paris Baguette (파리바게뜨)',

      ESFJ: { icon: '🧡', name: '카푸치노', brand: "Dunkin' (던킨)",

      ISTP: { icon: '🧊', name: '콜드 브루', brand: 'Mega Coffee (메가커피)',

      ISFP: { icon: '🤍', name: '아이스 라떼 (라떼 아트)', brand: 'Compose Coffee (컴포즈커피)',
        tagline: '깔끔한 미감, 조용한 감성.',
        desc: '흰색 톤으로 정돈된 <strong>컴포즈커피</strong>에서 마시는 섬세한 로제타가 그려진 <strong>아이스 라떼</strong> — 과시하지 않는 스타일. 당신처럼 자기만의 결을 조용히 지키는 사람에게 어울려요.' },
      ESTP: { icon: '🍨', name: '아포가토', brand: 'Tom N Toms (탐앤탐스)',
        tagline: '밤늦게까지, 모험은 계속된다.',
        desc: '시그니처 프레첼로 유명한 <strong>탐앤탐스</strong>에서 즐기는 <strong>아포가토</strong> — 차가운 젤라또 위로 뜨거운 에스프레소가 쏟아지는 작은 이벤트입니다. 당신처럼 늘 새로운 자극을 찾는 사람의 한 잔이에요.' },
      ESFP: { icon: '🎵', name: '시그니처 라떼', brand: 'Joe & The Juice (조앤더쥬스)',
        tagline: '음악이 흐르는 가장 신나는 공간.',
        desc: '비트가 흐르고 바리스타가 춤추듯 움직이는 <strong>조앤더쥬스</strong>에서 마시는 <strong>시그니처 라떼</strong> — 커피를 마시는 게 아니라 분위기를 마시는 곳이에요. 당신처럼 평범한 오후를 작은 파티로 바꾸는 사람의 한 잔.' },
    };

    const screens = {
      intro: document.getElementById('screenIntro'),
      question: document.getElementById('screenQuestion'),
      result: document.getElementById('screenResult'),
    };

    function show(name) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[name].classList.add('active');
      const card = screens[name].closest('.card');
      card.style.animation = 'none';
      void card.offsetWidth;
      card.style.animation = '';
    }

    let state = { i: 0, scores: { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 }, history: [] };

    function renderQuestion() {
      const q = QUESTIONS[state.i];
      document.getElementById('qNumber').textContent = `${QUESTIONS.length}문항 중 ${state.i + 1}번`;
      document.getElementById('qText').textContent = q.q;
      document.getElementById('progressFill').style.width = `${(state.i / QUESTIONS.length) * 100}%`;
      document.getElementById('backBtn').hidden = state.i === 0;

      const opts = document.getElementById('qOptions');
      opts.innerHTML = '';
      q.opts.forEach((text, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.textContent = text;
        btn.addEventListener('click', () => choose(q.letters[idx]));
        opts.appendChild(btn);
      });
    }

    function choose(letter) {
      state.scores[letter] = (state.scores[letter] || 0) + 1;
      state.history.push(letter);
      state.i++;
      if (state.i < QUESTIONS.length) {
        renderQuestion();
      } else {
        document.getElementById('progressFill').style.width = '100%';
        setTimeout(showResult, 250);
      }
    }

    function goBack() {
      if (state.i === 0) return;
      state.i--;
      const last = state.history.pop();
      if (last) state.scores[last] = Math.max(0, (state.scores[last] || 0) - 1);
      renderQuestion();
    }

    function computeType() {
      const s = state.scores;
      return (s.E >= s.I ? 'E' : 'I')
           + (s.S >= s.N ? 'S' : 'N')
           + (s.T >= s.F ? 'T' : 'F')
           + (s.J >= s.P ? 'J' : 'P');
    }

    function showResult() {
      const type = computeType();
      const c = COFFEES[type];
      document.getElementById('rBadge').textContent = type;
      document.getElementById('rIcon').textContent = c.icon;
      document.getElementById('rName').textContent = c.name;
      document.getElementById('rBrand').innerHTML = `<span class="at">📍</span>${c.brand}`;
      document.getElementById('rTagline').textContent = c.tagline;
      document.getElementById('rDescription').innerHTML = c.desc;
      show('result');
    }

    function reset() {
      state = { i: 0, scores: { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 }, history: [] };
      renderQuestion();
      show('question');
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      renderQuestion();
      show('question');
    });
    document.getElementById('retryBtn').addEventListener('click', reset);
    document.getElementById('backBtn').addEventListener('click', goBack);
    // ---------- Share ----------
    const shareMenu = document.getElementById('shareMenu');
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const isMac = /Mac/i.test(navigator.platform);

    // macOS가 아니면 '메시지' 항목 숨김 (Windows/Linux에서는 sms: 핸들러가 무의미)
    if (!isMac && !isMobile) {
      shareMenu.querySelectorAll('[data-mac-only]').forEach(el => el.remove());
    }

    function getShareContent() {
      const type = document.getElementById('rBadge').textContent;
      const c = COFFEES[type];
      const url = window.location.href;
      const message = `저는 ${type} — ${c.brand}의 "${c.name}"이 어울린대요! ☕`;
      return { type, c, url, message, full: `${message}\n${url}` };
    }

    function openShareMenu() { shareMenu.hidden = false; }
    function closeShareMenu() { shareMenu.hidden = true; }

    shareMenu.addEventListener('click', (e) => {
      if (e.target.dataset.close !== undefined) closeShareMenu();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !shareMenu.hidden) closeShareMenu();
    });

    shareMenu.querySelectorAll('.share-item').forEach(btn => {
      btn.addEventListener('click', async () => {
        const action = btn.dataset.action;
        const { url, message, full } = getShareContent();

        if (action === 'copy') {
          try {
            await navigator.clipboard.writeText(full);
            const label = btn.querySelector('.share-item-label');
            const orig = label.textContent;
            btn.classList.add('copied');
            label.textContent = '복사됨!';
            setTimeout(() => {
              btn.classList.remove('copied');
              label.textContent = orig;
              closeShareMenu();
            }, 1100);
          } catch (e) {
            alert('복사에 실패했어요.');
          }
          return;
        }

        let openUrl = '';
        if (action === 'imessage') {
          openUrl = `sms:?&body=${encodeURIComponent(full)}`;
          window.location.href = openUrl;
        } else if (action === 'twitter') {
          openUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(message)}&url=${encodeURIComponent(url)}`;
          window.open(openUrl, '_blank', 'noopener');
        } else if (action === 'threads') {
          openUrl = `https://www.threads.net/intent/post?text=${encodeURIComponent(full)}`;
          window.open(openUrl, '_blank', 'noopener');
        } else if (action === 'email') {
          openUrl = `mailto:?subject=${encodeURIComponent('당신은 어떤 커피인가요?')}&body=${encodeURIComponent(full)}`;
          window.location.href = openUrl;
        }
        closeShareMenu();
      });
    });

    document.getElementById('shareBtn').addEventListener('click', async () => {
      // 모바일에서는 네이티브 공유 시트가 KakaoTalk 등 앱 통합이 훨씬 좋음
      if (isMobile && navigator.share) {
        try {
          await navigator.share({ text: getShareContent().full });
          return;
        } catch (e) {
          if (e && e.name === 'AbortError') return;
          // 실패 시 커스텀 메뉴로 폴백
        }
      }
      openShareMenu();
    });

    // 배경에 떠다니는 커피콩 장식
    (function seedBeans() {
      const bg = document.getElementById('beansBg');
      const icons = ['☕', '🫘', '☕', '🫘', '☕'];
      for (let i = 0; i < 18; i++) {
        const b = document.createElement('div');
        b.className = 'bean';
        b.textContent = icons[i % icons.length];
        b.style.left = Math.random() * 100 + 'vw';
        b.style.animationDuration = (14 + Math.random() * 16) + 's';
        b.style.animationDelay = (-Math.random() * 20) + 's';
        b.style.fontSize = (0.9 + Math.random() * 1.4) + 'rem';
        bg.appendChild(b);
      }
    })();
  </script>
